name: build-exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller playwright imageio-ffmpeg
      - run: pyinstaller --onefile --noconsole --name StickmanStudio --icon icon.ico --add-data "ui.html;." --collect-all imageio_ffmpeg --collect-all playwright app.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Stickman Studio v1.${{ github.run_number }}
          files: dist/StickmanStudio.exe
